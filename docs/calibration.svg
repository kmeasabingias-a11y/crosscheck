  <text x="416.0" y="354" class="tick-x">0.0</text>
  <line x1="416" y1="278.0" x2="706" y2="278.0" class="grid"/>
  <text x="406" y="282.0" class="tick-y">0.2</text>
  <text x="474.0" y="354" class="tick-x">0.2</text>
  <line x1="416" y1="220.0" x2="706" y2="220.0" class="grid"/>
  <text x="406" y="224.0" class="tick-y">0.4</text>
  <text x="532.0" y="354" class="tick-x">0.4</text>
  <line x1="416" y1="162.0" x2="706" y2="162.0" class="grid"/>
  <text x="406" y="166.0" class="tick-y">0.6</text>
  <text x="590.0" y="354" class="tick-x">0.6</text>
  <line x1="416" y1="104.0" x2="706" y2="104.0" class="grid"/>
  <text x="406" y="108.0" class="tick-y">0.8</text>
  <text x="648.0" y="354" class="tick-x">0.8</text>
  <line x1="416" y1="46.0" x2="706" y2="46.0" class="grid"/>
  <text x="406" y="50.0" class="tick-y">1.0</text>
  <text x="706.0" y="354" class="tick-x">1.0</text>
  <line x1="416.0" y1="336.0" x2="706.0" y2="46.0" class="diagonal"/>
  <rect x="621.0" y="46.0" width="25.0" height="290.0" fill="#4c8dd9" fill-opacity="0.40" rx="2"/>
  <circle cx="633.5" cy="118.5" r="3.4" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
  <text x="633.5" y="60.0" class="count-in-dark">n=1</text>
  <text x="633.5" y="109.5" class="gap-under">-0.25</text>
  <rect x="650.0" y="162.0" width="25.0" height="174.0" fill="#d98324" fill-opacity="0.85" rx="2"/>
  <circle cx="663.1" cy="88.9" r="3.4" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
  <text x="662.5" y="155.0" class="count">n=10</text>
  <text x="662.5" y="79.9" class="gap-over">+0.25</text>
  <rect x="679.0" y="46.0" width="25.0" height="290.0" fill="#4c8dd9" fill-opacity="0.65" rx="2"/>
  <circle cx="685.7" cy="66.3" r="3.4" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
  <text x="691.5" y="60.0" class="count-in">n=6</text>
  <rect x="416" y="46" width="290" height="290" class="frame"/>
  <text x="561.0" y="376" class="axis">Judge confidence</text>
    <rect x="56" y="383" width="11" height="11" fill="#d98324" fill-opacity="0.82" rx="2"/>
  <text x="73" y="392" class="legend">overconfident (confidence exceeds accuracy by &gt;.05)</text>
  <rect x="386" y="383" width="11" height="11" fill="#4c8dd9" fill-opacity="0.82" rx="2"/>
  <text x="403" y="392" class="legend">calibrated</text>
  <circle cx="508" cy="388" r="3.4" fill="#ffffff" stroke="#1f2328" stroke-width="1.4"/>
  <text x="518" y="392" class="legend">stated confidence</text>
</svg>
