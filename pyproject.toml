[project]
name = "crosscheck"
version = "0.2.0"
description = "Cross-document contradiction detection with a rigorous evaluation framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Easab Ingias", email = "easabingias@gmail.com" }]
keywords = ["nlp", "contradiction-detection", "rag", "evaluation", "llm"]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "loguru>=0.7",
    "anthropic>=0.115",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "markdown-it-py>=3.0",
    "pysbd>=0.3.4",
    "qdrant-client>=1.15",
    "sentence-transformers>=5.6.0",
    "fastembed>=0.8.0",
    # torch is pulled by sentence-transformers; declared here so the CPU-wheel source
    # pin below binds to it (uv sources only apply to declared deps). See D22.
    "torch>=2.2",
    "openai>=2.52.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # FastAPI parses multipart/form-data (POST /ingest) only when this is installed; without
    # it the upload route raises at request time rather than at import, so it is a hard dep.
    "python-multipart>=0.0.9",
]
[project.optional-dependencies]
# The Streamlit demo (§7.7). An extra rather than a core dependency: someone installing the CLI
# to audit a folder should not pull a web framework, and the deployed demo installs `.[ui]`.
# httpx moves here from the dev group because the UI is the first thing in the project that
# *makes* HTTP requests rather than answering them — the service itself never did.
ui = [
    "streamlit>=1.40",
    "httpx>=0.27",
]

[project.scripts]
crosscheck = "crosscheck.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    # Writes the PDF fixtures for the parser tests and the acceptance corpus.
    # Dev-only: nothing in src/ writes PDFs, it only reads them via pdfplumber.
    "fpdf2>=2.7",
    # Starlette's TestClient is built on httpx. Dev-only: the service itself never makes
    # HTTP requests, it only answers them.
    "httpx>=0.27",
    # Needed by `tests/unit/test_streamlit_app.py`, which drives the demo through Streamlit's own
    # AppTest harness. The demo is the deliverable a reader actually looks at (§13), and a smoke
    # test that renders it catches the failures unit tests structurally cannot — an import error,
    # a session-state mistake, an exception raised mid-render. Duplicated with the `ui` extra on
    # purpose so `uv sync --frozen` keeps working unchanged in CI.
    "streamlit>=1.40",
]

# ---------------------------------------------------------------------------
# Install torch from the CPU-only wheel index. sentence-transformers pulls torch,
# whose default Linux wheel bundles the full CUDA stack (~5 GB, ~20 nvidia-* pkgs)
# that is useless without a GPU. CrossCheck targets commodity hardware (spec §2),
# so we pin the CPU build. See DECISIONS.md D22.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Redirect torch to the CPU index only where that index has wheels (Linux/Windows).
# macOS torch on PyPI is already CPU-only, so it falls through to the default index.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosscheck"]

# ---------------------------------------------------------------------------
# Lint + format: ruff is the single tool (no black). See DECISIONS.md D7.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort (import ordering)
    "N",        # pep8-naming
    "UP",       # pyupgrade (modern syntax)
    "B",        # flake8-bugbear
    "A",        # flake8-builtins (shadowing)
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "PTH",      # flake8-use-pathlib
    "RUF",      # ruff-specific rules
    "D",        # pydocstyle (Google convention, spec §11)
]
ignore = [
    "D105",  # docstring on magic methods — optional
    "D107",  # docstring on __init__ — documented at class level instead
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]           # tests don't need docstrings
"**/__init__.py" = ["D104"]  # package docstring optional

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Types: mypy --strict with the pydantic plugin. See DECISIONS.md D7.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "docx.*", "pysbd.*", "sentence_transformers.*", "fastembed.*", "fpdf.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
filterwarnings = [
    "ignore:invalid escape sequence:DeprecationWarning",
]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: end-to-end tests that make real LLM/service calls (needs API keys / Qdrant); skipped by default",
    "benchmark: on-demand benchmark/eval runs that write to benchmarks/results/",
]

[tool.coverage.run]
source = ["src/crosscheck"]
branch = true

[tool.coverage.report]
show_missing = true
